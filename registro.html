<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Compostaje | Registro Diario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f8;
        }
        .navbar {
            background-color: #1e3a2f;
        }
        .navbar-brand, .nav-link {
            color: #ffffff !important;
        }
        .form-card {
            border-left: 6px solid #198754;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Sistema de Compostaje</a>

        <div>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="unidades.html">Unidades/Lotes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="registro.html">Registro Diario</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="alertas.html">Alertas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="reportes.html">Reportes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="usuarios.html">Usuarios</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h4 class="mb-4">Registro Diario de Variables</h4>

    <div class="card shadow-sm p-4 form-card">

        <form id="registroForm">

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="unidadRegistro" class="form-label">Unidad</label>
                    <select id="unidadRegistro" name="unidadRegistro" class="form-select" required>
                        <option value="">Seleccionar Unidad</option>
                        <option value="U1-A2026">Unidad 1 - Lote A-2026</option>
                        <option value="U2-B2026">Unidad 2 - Lote B-2026</option>
                        <option value="U3-C2025">Unidad 3 - Lote C-2025</option>
                    </select>
                </div>


                <div class="col-md-6">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Temperatura (°C)</label>
                    <input type="number" class="form-control" min="0" max="90" step="0.1" required>
                    <div class="form-text">Rango esperado: 35–70°C</div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Humedad (%)</label>
                    <input type="number" class="form-control" min="0" max="100" step="0.1" required>
                    <div class="form-text">Rango óptimo: 40–65%</div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">pH</label>
                    <input type="number" class="form-control" min="4" max="9" step="0.1" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Observaciones</label>
                <textarea class="form-control" rows="3" placeholder="Olores, lixiviados, compactación, presencia de insectos..."></textarea>
            </div>

            <div class="mb-3">
                <label for="accionCorrectiva" class="form-label">Acción Correctiva Aplicada</label>
                <select id="accionCorrectiva" name="accionCorrectiva" class="form-select">
                    <option value="ninguna">Ninguna</option>
                    <option value="volteo">Volteo realizado</option>
                    <option value="material_seco">Adición de material seco</option>
                    <option value="riego">Riego aplicado</option>
                </select>
            </div>


            <button type="submit" class="btn btn-success">Registrar Datos</button>

        </form>

    </div>

    <!-- Mensaje de Confirmación -->
    <div id="mensajeExito" class="alert alert-success mt-4 d-none">
        Registro guardado correctamente (simulación estática).
    </div>

</div>

<script>
    document.getElementById("registroForm").addEventListener("submit", function(event){
        event.preventDefault();
        document.getElementById("mensajeExito").classList.remove("d-none");
        this.reset();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
